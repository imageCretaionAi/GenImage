<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio - Direct Image Generator</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-glow: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --accent-hover: linear-gradient(135deg, #4f46e5, #9333ea, #db2777);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 2rem; }

    header { text-align: center; margin-top: 1rem; }
    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p { color: var(--text-muted); font-size: 1rem; }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .upload-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: calc(var(--radius) - 4px);
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upload-zone:hover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.05);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .file-input { display: none; }

    .file-status {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .btn-generate {
      margin-top: 1.5rem;
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: calc(var(--radius) - 4px);
      background: var(--accent-glow);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
      transition: all 0.2s ease;
    }

    .btn-generate:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-generate:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .progress-section, .output-section { display: none; }
    .progress-section.active, .output-section.active { display: block; }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-glow);
      transition: width 0.2s ease;
    }

    .download-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .download-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: calc(var(--radius) - 4px);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .download-card:hover {
      transform: translateY(-4px);
      border-color: #a855f7;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background: rgba(168, 85, 247, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .btn-download-direct {
      width: 100%;
      background: var(--accent-glow);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s ease;
    }

    .btn-download-direct:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Studio Generator</h1>
      <p>Upload your reference files to synthesize high-resolution outputs</p>
    </header>

    <div class="glass-card">
      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📁</span>
        <p><strong>Click to choose images</strong> or drag & drop files here</p>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">PNG, JPG, WEBP formats supported</p>
        <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
      </div>
      <div class="file-status" id="fileStatus"></div>
      <button class="btn-generate" id="generateBtn" disabled>Generate AI Images</button>
    </div>

    <div class="glass-card progress-section" id="progressSection">
      <div style="display:flex; justify-content:space-between; font-weight:600;">
        <span id="statusText">Processing neural networks...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="glass-card output-section" id="outputSection">
      <h2>Generated Outputs Ready</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Click any file below to download directly in full PNG resolution.</p>
      
      <div class="download-grid" id="downloadGrid"></div>
    </div>
  </div>

  <script>
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const generateBtn = document.getElementById('generateBtn');
    
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const progressPercent = document.getElementById('progressPercent');
    
    const outputSection = document.getElementById('outputSection');
    const downloadGrid = document.getElementById('downloadGrid');

    let selectedFiles = [];

    uploadZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      if (selectedFiles.length > 0) {
        fileStatus.innerText = `✓ ${selectedFiles.length} file(s) selected`;
        generateBtn.disabled = false;
      }
    });

    generateBtn.addEventListener('click', () => {
      generateBtn.disabled = true;
      outputSection.classList.remove('active');
      progressSection.classList.add('active');
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        progressBar.style.width = `${progress}%`;
        progressPercent.innerText = `${progress}%`;

        if (progress === 30) statusText.innerText = "Enhancing resolution details...";
        if (progress === 70) statusText.innerText = "Finalizing PNG files...";

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            progressSection.classList.remove('active');
            renderDownloadButtons();
            generateBtn.disabled = false;
          }, 400);
        }
      }, 150);
    });

    // List of txt files located in your outputs folder on GitHub Pages
    const outputFiles = [
      { name: 'Generated Output 1', path: './outputs/1.txt', saveName: 'AI_Output_1.png' },
      { name: 'Generated Output 2', path: './outputs/2.txt', saveName: 'AI_Output_2.png' },
      { name: 'Generated Output 3', path: './outputs/3.txt', saveName: 'AI_Output_3.png' },
      { name: 'Generated Output 4', path: './outputs/4.txt', saveName: 'AI_Output_4.png' },
      { name: 'Generated Output 5', path: './outputs/5.txt', saveName: 'AI_Output_5.png' },
      { name: 'Generated Output 6', path: './outputs/6.txt', saveName: 'AI_Output_6.png' }
    ];

    function renderDownloadButtons() {
      outputSection.classList.add('active');
      downloadGrid.innerHTML = '';

      outputFiles.forEach((file) => {
        const card = document.createElement('div');
        card.className = 'download-card';

        card.innerHTML = `
          <div class="card-icon">🖼️</div>
          <div>
            <h3 style="font-size: 1.1rem; font-weight: 600;">${file.name}</h3>
            <span style="font-size: 0.8rem; color: var(--text-muted);">PNG Format</span>
          </div>
          <button class="btn-download-direct">
            ⬇️ Download PNG
          </button>
        `;

        const downloadBtn = card.querySelector('button');
        downloadBtn.addEventListener('click', () => triggerTxtToPngDownload(file.path, file.saveName, downloadBtn));

        downloadGrid.appendChild(card);
      });
    }

    async function triggerTxtToPngDownload(filePath, saveFileName, buttonElement) {
      const originalText = buttonElement.innerText;
      buttonElement.innerText = '⏳ Downloading...';
      buttonElement.disabled = true;

      try {
        // 1. Fetch text content from GitHub Pages
        const response = await fetch(filePath, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        let rawBase64 = await response.text();
        
        // 2. Clean out unnecessary characters
        rawBase64 = rawBase64.trim().replace(/[\r\n\s]+/g, '');
        if (rawBase64.includes(';base64,')) {
          rawBase64 = rawBase64.split(';base64,')[1];
        }

        // 3. Decode base64 to binary bytes
        const byteCharacters = atob(rawBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);

        // 4. Create Blob binary stream with PNG mime-type
        const blob = new Blob([byteArray], { type: 'image/png' });
        const blobUrl = URL.createObjectURL(blob);

        // 5. Force download as PNG
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = saveFileName;
        document.body.appendChild(a);
        a.click();
        
        // Clean up
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

      } catch (err) {
        alert(`Failed to download ${saveFileName}. Ensure ${filePath} exists in your GitHub repository.`);
        console.error(err);
      } finally {
        buttonElement.innerText = originalText;
        buttonElement.disabled = false;
      }
    }
  </script>
</body>
</html>
